<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{NAME}} — nautilai</title>
<meta name="description" content="{{META_DESCRIPTION}}" />
<meta property="og:title" content="{{NAME}} — nautilai" />
<meta property="og:description" content="{{META_DESCRIPTION}}" />
<meta property="og:type" content="website" />
<meta name="theme-color" content="#0a141d" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Literata:ital,opsz,wght@0,7..72,400..600;1,7..72,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/plugin.css" />
</head>
<body>
<div id="copy-live" class="visually-hidden" aria-live="polite" role="status"></div>
<div class="wrap">
  <a class="back" href="../index.html#plugins">&larr; all plugins</a>

  <header class="plugin-hero">
    <h1 class="plugin-name">{{NAME}}</h1>
    <p class="tagline">{{TAGLINE}}</p>
  </header>

  <section id="install">
    <h2>Install</h2>
    <div class="copyfield">
      <code class="cf-code"><span class="prompt">/</span>{{INSTALL_CMD}}</code>
      <button class="copy-btn" type="button" data-copy="/{{INSTALL_CMD}}" aria-label="Copy install command">
        <svg class="ic-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <svg class="ic-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
        <svg class="ic-fail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        <span class="cf-label" aria-hidden="true">Copy</span>
      </button>
    </div>
  </section>

  <section id="what">
    <h2>What it does</h2>
    <p>{{WHAT_IT_DOES}}</p>
  </section>

  <section id="commands">
    <h2>Commands / skills</h2>
    <ul class="skill-list">
      {{SKILL_ITEMS}}
      <!-- repeat: <li><div class="sk-name">{{SKILL_NAME}}</div><p>{{SKILL_DESC}}</p><div class="sk-triggers">{{TRIGGER_PHRASES}}</div></li> -->
    </ul>
  </section>

  <section id="how">
    <h2>How it works</h2>
    {{HOW_IT_WORKS}}
    <!-- one or more <p> or a short <ol>/<ul> -->

    <!-- FLOW DIAGRAM example (single lane, ≤7 steps total) — see _slots.md.
         Each step gets a numbered badge (fs-num) and an optional monospace
         sublabel (fs-sub) naming the script/command that runs it — omit
         fs-sub when the README doesn't name one for that exact step.
    <div class="flow">
      <div class="flow-step"><span class="fs-num">1</span><span class="fs-body"><span class="fs-label">stage files</span><span class="fs-sub">git add &lt;file&gt;</span></span></div>
      <div class="flow-arrow" aria-hidden="true"></div>
      <div class="flow-step"><span class="fs-num">2</span><span class="fs-body"><span class="fs-label">generate message</span></span></div>
      <div class="flow-arrow" aria-hidden="true"></div>
      <div class="flow-step"><span class="fs-num">3</span><span class="fs-body"><span class="fs-label">pre-commit hooks</span></span></div>
      <div class="flow-arrow" aria-hidden="true"></div>
      <div class="flow-step"><span class="fs-num">4</span><span class="fs-body"><span class="fs-label">commit</span></span></div>
    </div>
    -->

    <!-- FLOW DIAGRAM example with a decision split into ok/degrade lanes, steps
         across the shared row + all lanes ≤7 — see _slots.md. Give each lane a
         data-lane value; "degrade" gets the warm tint + a ⚠ prefix (never color
         alone). The .flow-split connector marks the actual branch point. Numbering
         restarts at 1 per diagram — this is a second, separate diagram from the one
         above, not a continuation of it.
    <div class="flow">
      <div class="flow-step"><span class="fs-num">1</span><span class="fs-body"><span class="fs-label">SessionStart fires</span><span class="fs-sub">session-start-pickup.sh</span></span></div>
    </div>
    <div class="flow-legend">
      <span class="fl-item"><span class="fl-swatch" data-lane="ok"></span> within TTL</span>
      <span class="fl-item"><span class="fl-swatch" data-lane="degrade"></span> TTL expired</span>
    </div>
    <div class="flow-split" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v6"/><path d="M12 10c0 4-6 2-6 7"/><path d="M12 10c0 4 6 2 6 7"/></svg></div>
    <div class="flow-lanes">
      <div class="flow-lane" data-lane="ok"><span class="flow-lane-label">ok</span>
        <div class="flow-step"><span class="fs-num">2</span><span class="fs-body"><span class="fs-label">within TTL</span></span></div>
        <div class="flow-arrow" aria-hidden="true"></div>
        <div class="flow-step"><span class="fs-num">3</span><span class="fs-body"><span class="fs-label">inject + mark consumed</span></span></div>
      </div>
      <div class="flow-lane" data-lane="degrade"><span class="flow-lane-label">degrade</span>
        <div class="flow-step"><span class="fs-num">2</span><span class="fs-body"><span class="fs-label">TTL expired</span></span></div>
        <div class="flow-arrow" aria-hidden="true"></div>
        <div class="flow-step"><span class="fs-num">3</span><span class="fs-body"><span class="fs-label">left on disk, not injected</span></span></div>
      </div>
    </div>
    -->

    <!-- COLLAPSIBLE TECH DETAIL example — see _slots.md for the no-invention rule and 25-line cap
    <details class="tech">
      <summary>Under the hood</summary>
      <div class="tech-body">
        <ul>
          <li><code>script-name.sh</code> — what it does, sourced from the README.</li>
          <li>Storage path, env var, or exit code the README documents.</li>
        </ul>
      </div>
    </details>
    -->
  </section>

  <section id="requirements">
    <!-- OMIT this whole <section> if the plugin has no requirements beyond Claude Code itself -->
    <h2>Requirements</h2>
    <p>{{REQUIREMENTS}}</p>
  </section>

  <footer>
    <nav class="foot-links">
      <a href="https://github.com/starfysh-tech/nautilai/tree/main/{{PLUGIN_DIR}}" target="_blank" rel="noopener noreferrer">Source on GitHub</a>
      <a href="../index.html#plugins">&larr; all plugins</a>
    </nav>
  </footer>
</div>

<script src="../assets/plugin.js"></script>
</body>
</html>
